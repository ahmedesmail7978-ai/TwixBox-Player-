<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>by Twixoff — Плеер</title>
<link rel="stylesheet" href="twixbox.css">
<link rel="stylesheet" href="kinobox.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#0a0510;overflow:hidden}
#embedBox{
  width:100%;height:100vh;
  display:flex;align-items:center;justify-content:center;
  position:relative;overflow:visible;
}
.loader{color:#c4b5fd;font-family:sans-serif;font-size:14px;text-align:center}
.err{color:#f472b6;font-family:sans-serif;font-size:13px;text-align:center;padding:20px}
iframe{border:none!important}

/* Input panel styles */
.input-panel {
  position: absolute;
  top: 16px;
  left: 16px;
  z-index: 500;
  display: flex;
  gap: 8px;
  align-items: center;
  background: rgba(15, 15, 19, 0.95);
  padding: 10px;
  border-radius: 12px;
  border: 2px solid rgba(139, 92, 246, 0.3);
  backdrop-filter: blur(10px);
}
.input-panel input {
  background: rgba(24, 24, 27, 0.9);
  border: 2px solid rgba(139, 92, 246, 0.3);
  color: #fff;
  padding: 8px 12px;
  border-radius: 8px;
  font-size: 14px;
  font-weight: 500;
  width: 150px;
  outline: none;
  transition: all 0.2s;
}
.input-panel input:focus {
  border-color: #8b5cf6;
  box-shadow: 0 0 10px rgba(139, 92, 246, 0.4);
  width: 180px;
}
.input-panel input::placeholder {
  color: #71717a;
}
.input-panel button {
  background: linear-gradient(135deg, #8b5cf6, #ec4899);
  border: none;
  color: #fff;
  padding: 8px 16px;
  border-radius: 8px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.input-panel button:hover {
  transform: translateY(-2px);
  box-shadow: 0 0 20px rgba(139, 92, 246, 0.6);
}
.input-panel button:active {
  transform: translateY(0);
}
</style>
</head>
<body>
<div id="embedBox">
  <div class="input-panel">
    <input type="text" id="movieIdInput" placeholder="ID фильма (KP)" />
    <button onclick="loadMovie()">Загрузить</button>
  </div>
  <div class="loader">⏳ Загрузка плеера...</div>
</div>

<script>
(function(){
  var proxies = [
    window.location.origin,
    "https://bytwixoff.tatnet.app"
  ];

  function normalize(base){ return base.replace(/\/$/, "") + "/kinobox.js"; }

  function loadScript(url, onOk, onErr){
    var s = document.createElement("script");
    s.src = url; s.async = true;
    s.onload = onOk; s.onerror = onErr;
    document.head.appendChild(s);
  }

  function loadFrom(i){
    if(i >= proxies.length){
      console.error("[by Twixoff] kinobox.js не загрузился");
      var b = document.getElementById('embedBox');
      if(b) b.innerHTML = '<div class="err">⚠️ Не удалось загрузить плеер</div>';
      return;
    }
    var src = normalize(proxies[i]);
    loadScript(src, function(){ console.info("[by Twixoff] kinobox.js:", src); }, function(){ loadFrom(i+1); });
  }
  loadFrom(0);
})();
</script>

<script>
var currentKpId = null;
var playerInstance = null;

function getKpId(){
  var params = new URLSearchParams(window.location.search);
  var q = params.get('kp') || params.get('id') || params.get('kinopoisk');
  if(q && /^\d+$/.test(q)) return parseInt(q,10);
  var h = (window.location.hash||'').replace(/^#\/?/,'');
  var m = h.match(/^(?:films\/|serials\/)?(\d+)/i);
  return m ? parseInt(m[1],10) : null;
}

function forceOpen(){
  document.querySelectorAll('.kinobox_menu,.kbt_list,[class*="kinobox_menu"]').forEach(function(el){
    el.classList.add('kinobox_menu_open');
  });
  document.querySelectorAll('.kbt_list ul,.kinobox_menu ul,ul.svelte-l0obux').forEach(function(ul){
    ul.style.setProperty('right','0','important');
    ul.style.setProperty('display','block','important');
    ul.style.setProperty('visibility','visible','important');
    ul.style.setProperty('opacity','1','important');
    ul.style.setProperty('transform','none','important');
  });
}

function tryInit(startTs){
  if(typeof window.kinobox === 'function'){
    var box = document.getElementById('embedBox');
    
    var kpId = getKpId();
    if(kpId){
      currentKpId = kpId;
      document.getElementById('movieIdInput').value = kpId;
    }
    
    box.innerHTML = '';
    
    var panel = document.createElement('div');
    panel.className = 'input-panel';
    panel.innerHTML = '<input type="text" id="movieIdInput" placeholder="ID фильма (KP)" />' +
                      '<button onclick="loadMovie()">Загрузить</button>';
    box.appendChild(panel);
    
    var playerDiv = document.createElement('div');
    playerDiv.id = 'twixPlayer';
    playerDiv.style.width = '100%';
    playerDiv.style.height = '100%';
    box.appendChild(playerDiv);
    
    if(currentKpId){
      try{
        playerInstance = window.kinobox('#twixPlayer', {search:{kinopoisk: currentKpId}});
        var n=0, t=setInterval(function(){ forceOpen(); if(++n>30) clearInterval(t); }, 200);
      }catch(e){
        box.innerHTML = '<div class="err">⚠️ Ошибка: '+(e.message||e)+'</div>';
      }
    }
    return;
  }
  if(Date.now() - startTs < 25000) setTimeout(function(){ tryInit(startTs); }, 200);
  else {
    document.getElementById('embedBox').innerHTML =
      '<div class="err">⚠️ Плеер не загрузился. Отключите блокировщик и обновите.<br><br>' +
      '<button onclick="location.reload()" style="background:linear-gradient(135deg,#8b5cf6,#ec4899);color:#fff;border:0;border-radius:8px;padding:8px 14px;cursor:pointer">Повторить</button></div>';
  }
}

function loadMovie(){
  var input = document.getElementById('movieIdInput');
  var kpId = parseInt(input.value.trim(), 10);
  if(!kpId || isNaN(kpId)){
    alert('Введите корректный ID фильма (число)');
    return;
  }
  currentKpId = kpId;
  
  var box = document.getElementById('embedBox');
  var playerDiv = document.getElementById('twixPlayer');
  if(playerDiv){
    playerDiv.innerHTML = '';
    try{
      playerInstance = window.kinobox('#twixPlayer', {search:{kinopoisk: currentKpId}});
      var n=0, t=setInterval(function(){ forceOpen(); if(++n>30) clearInterval(t); }, 200);
    }catch(e){
      alert('Ошибка: '+(e.message||e));
    }
  }
  
  var newUrl = window.location.pathname + '?kp=' + kpId;
  window.history.pushState({}, '', newUrl);
}

tryInit(Date.now());
window.addEventListener('hashchange', function(){ location.reload(); });
</script>
</body>
</html>
