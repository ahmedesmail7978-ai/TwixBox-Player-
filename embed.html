<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>by Twixoff — Плеер</title>
<link rel="stylesheet" href="twixbox.css">
<link rel="stylesheet" href="kinobox.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#0a0510;overflow:hidden}
#embedBox{
  width:100%;height:100vh;
  display:flex;align-items:center;justify-content:center;
  position:relative;overflow:visible;
}
.loader{color:#c4b5fd;font-family:sans-serif;font-size:14px;text-align:center}
.err{color:#f472b6;font-family:sans-serif;font-size:13px;text-align:center;padding:20px}
iframe{border:none!important}
</style>
</head>
<body>
<div id="embedBox">
  <div class="loader">⏳ Загрузка плеера...</div>
</div>

<script>
(function(){
  // LOCAL FIRST — как должно быть
  var proxies = [
    window.location.origin,
    "https://bytwixoff.tatnet.app"
  ];

  function normalize(base){ return base.replace(/\/$/, "") + "/kinobox.js"; }

  function loadScript(url, onOk, onErr){
    var s = document.createElement("script");
    s.src = url; s.async = true;
    s.onload = onOk; s.onerror = onErr;
    document.head.appendChild(s);
  }

  function loadFrom(i){
    if(i >= proxies.length){
      console.error("[by Twixoff] kinobox.js не загрузился");
      var b = document.getElementById('embedBox');
      if(b) b.innerHTML = '<div class="err">⚠️ Не удалось загрузить плеер</div>';
      return;
    }
    var src = normalize(proxies[i]);
    loadScript(src, function(){ console.info("[by Twixoff] kinobox.js:", src); }, function(){ loadFrom(i+1); });
  }
  loadFrom(0);
})();
</script>

<script>
(function(){
  function getKpId(){
    var params = new URLSearchParams(window.location.search);
    var q = params.get('kp') || params.get('id') || params.get('kinopoisk');
    if(q && /^\d+$/.test(q)) return parseInt(q,10);
    var h = (window.location.hash||'').replace(/^#\/?/,'');
    var m = h.match(/^(?:films\/|serials\/)?(\d+)/i);
    return m ? parseInt(m[1],10) : null;
  }

  var kpId = getKpId();
  if(!kpId){
    document.getElementById('embedBox').innerHTML =
      '<div class="err">⚠️ Не указан ID.<br>Формат: <code>/embed.html#301</code> или <code>?kp=301</code></div>';
    return;
  }

  function forceOpen(){
    document.querySelectorAll('.kinobox_menu,.kbt_list,[class*="kinobox_menu"]').forEach(function(el){
      el.classList.add('kinobox_menu_open');
    });
    document.querySelectorAll('.kbt_list ul,.kinobox_menu ul,ul.svelte-l0obux').forEach(function(ul){
      ul.style.setProperty('right','0','important');
      ul.style.setProperty('display','block','important');
      ul.style.setProperty('visibility','visible','important');
      ul.style.setProperty('opacity','1','important');
      ul.style.setProperty('transform','none','important');
    });
  }

  function tryInit(startTs){
    if(typeof window.kinobox === 'function'){
      var box = document.getElementById('embedBox');
      box.innerHTML = '';
      box.id = 'twixPlayer';
      try{
        window.kinobox('#twixPlayer', {search:{kinopoisk: kpId}});
        var n=0, t=setInterval(function(){ forceOpen(); if(++n>30) clearInterval(t); }, 200);
      }catch(e){
        box.innerHTML = '<div class="err">⚠️ Ошибка: '+(e.message||e)+'</div>';
      }
      return;
    }
    if(Date.now() - startTs < 25000) setTimeout(function(){ tryInit(startTs); }, 200);
    else {
      document.getElementById('embedBox').innerHTML =
        '<div class="err">⚠️ Плеер не загрузился. Отключите блокировщик и обновите.<br><br>'+
        '<button onclick="location.reload()" style="background:linear-gradient(135deg,#8b5cf6,#ec4899);color:#fff;border:0;border-radius:8px;padding:8px 14px;cursor:pointer">Повторить</button></div>';
    }
  }

  tryInit(Date.now());
  window.addEventListener('hashchange', function(){ location.reload(); });
})();
</script>
</body>
</html>
