<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>by Twixoff — Test Player</title>
<link rel="stylesheet" href="twixbox.css">
<link rel="stylesheet" href="kinobox.css">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;background:#0a0510;overflow:hidden}
  #player{
    width:100%;height:100vh;min-height:400px;
    position:relative;overflow:visible;
  }
  /* extra force */
  #player .kbt_list ul,
  #player .kinobox_menu ul {
    right: 0 !important;
    display: block !important;
    visibility: visible !important;
    opacity: 1 !important;
  }
</style>
</head>
<body>
<div id="player"></div>
<script src="kinobox.js"></script>
<script>
  var params = new URLSearchParams(location.search);
  var kp = parseInt(params.get('kp') || params.get('id') || '301', 10);

  function forceOpenMenu(){
    // Force open class on any menu
    document.querySelectorAll('.kinobox_menu, .kbt_list, [class*="kinobox_menu"]').forEach(function(el){
      el.classList.add('kinobox_menu_open');
    });
    document.querySelectorAll('.kbt_list ul, .kinobox_menu ul').forEach(function(ul){
      ul.style.setProperty('right', '0', 'important');
      ul.style.setProperty('display', 'block', 'important');
      ul.style.setProperty('visibility', 'visible', 'important');
      ul.style.setProperty('opacity', '1', 'important');
    });
  }

  if (typeof kinobox === 'function') {
    kinobox('#player', { search: { kinopoisk: kp } });
    // keep forcing open for a few seconds while player initializes
    var n = 0;
    var t = setInterval(function(){
      forceOpenMenu();
      if(++n > 20) clearInterval(t);
    }, 300);
  } else {
    document.getElementById('player').innerHTML =
      '<div style="color:#f472b6;text-align:center;padding:40px;font-family:sans-serif">kinobox.js не загрузился</div>';
  }
</script>
</body>
</html>
